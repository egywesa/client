<div class="block-header">
  <div class="row">
    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item active">{{ 'Company Profile'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-4 col-md-12">
    <div class="card">
      <div class="body">
          <div class="card-body text-center">
          <img src="/assets/images/quickbooks.png" class="card-img-top" style="max-width: 150px;">
            <h5 class="card-title">QuickBooks</h5>
            <a (click)="redirectToUrl('quickBooks')" class="btn btn-primary" *ngIf="!quickBooksSynced">{{ 'sync' | translate }}</a>
            <a class="btn btn-primary disabled" disabled *ngIf="quickBooksSynced">{{ 'synced' | translate }}</a>
          </div>
      </div>
    </div>
  </div>

  <div class="col-lg-4 col-md-12">
    <div class="card">
      <div class="body">
        <div class="card-body text-center">
          <img src="/assets/images/xero.png" class="card-img-top" style="max-width: 150px;">
          <h5 class="card-title">Xero</h5>
          <a (click)="redirectToUrl('xero')" class="btn btn-primary" *ngIf="!xeroSynced">{{ 'sync' | translate }}</a>
          <a class="btn btn-primary disabled" disabled *ngIf="xeroSynced">{{ 'synced' | translate }}</a>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-4 col-md-12">
    <div class="card">
      <div class="body">
        <div class="card-body text-center">
          <img src="/assets/images/sage.png" class="card-img-top" style="max-width: 150px;">
          <h5 class="card-title">Sage</h5>
          <a class="btn btn-primary disabled" disabled>{{ 'sync' | translate }}</a>
        </div>
      </div>
    </div>
  </div>


</div>
