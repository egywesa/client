<div class="block-header">
  <div class="row">
    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item"><a routerLink="/dashboard/companies">{{'Companies'|translate}}</a></li>
        <li class="breadcrumb-item active">{{ 'Add New'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-12 col-md-12">
    <div class="card">
      <div class="header">
        <h2> {{'Add New'|translate}}</h2>
      </div>
      <div class="body">
<!--        activityId: number,-->
<!--        // user-->
        <form [formGroup]="companyForm" (submit)="onSubmit()" enctype="multipart/form-data">
          <div class="row">
            <div class="col-md-6 form-group">
              <label>{{'Company Name Arabic'|translate}}</label>
              <app-text-input [label]="'Company Name Arabic'|translate" formControlName="companyNameAr"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Company Name English'|translate}}</label>
              <app-text-input [label]="'Company Name English'|translate" formControlName="companyNameEn"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Address Arabic'|translate}}</label>
              <app-text-input [label]="'Address Arabic'|translate" formControlName="companyAddressAr"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Address English'|translate}}</label>
              <app-text-input [label]="'Address English'|translate" formControlName="companyAddressEn"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'commercialRegNumber'|translate}}</label>
              <app-text-input [label]="'commercialRegNumber'|translate" formControlName="commercialRegNumber"></app-text-input>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'logo'|translate}}</label>
              <app-text-input [type]="'file'" (change)="onFileChange($event)" [label]="'logo'|translate" formControlName="logo"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'vat'|translate}}</label>
              <app-text-input [label]="'vat'|translate" formControlName="vat"></app-text-input>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'firstName'|translate}}</label>
              <app-text-input [label]="'firstName'|translate" formControlName="firstName"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'lastName'|translate}}</label>
              <app-text-input [label]="'lastName'|translate" formControlName="lastName"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'email'|translate}}</label>
              <app-text-input [label]="'email'|translate" formControlName="email"></app-text-input>
            </div>
            <!-- <div class="col-md-6 form-group">
              <label dir="auto">{{'BuildingNumber'|translate}}</label>
              <app-text-input [label]="'BuildingNumber'|translate" formControlName="buildingNumber"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'CitySubdivisionName'|translate}}</label>
              <app-text-input [label]="'CitySubdivisionName'|translate"
                formControlName="citySubdivisionName"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label dir="auto">{{'PostalZone'|translate}}</label>
              <app-text-input [label]="'PostalZone'|translate" formControlName="postalZone"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'StreetName'|translate}}</label>
              <app-text-input [label]="'StreetName'|translate" formControlName="streetName"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'CountrySubentity'|translate}}</label>
              <app-text-input [label]="'CountrySubentity'|translate" formControlName="countrySubentity"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'PlotIdentification'|translate}}</label>
              <app-text-input [label]="'PlotIdentification'|translate" formControlName="plotIdentification"></app-text-input>
            </div> -->
            <div class="col-md-6 form-group">
              <label>{{'phoneNumber'|translate}}</label>
              <app-text-input [label]="'phoneNumber'|translate" formControlName="phoneNumber"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'password'|translate}}</label>
              <app-text-input [label]="'password'|translate" formControlName="password"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'city'|translate}}</label>
              <select class="form-control" formControlName="cityId" [compareWith]="compareCity">
                <option [ngValue]="null">{{ 'choose city' | translate }}</option>
                <option [ngValue]="city.id" *ngFor="let city of cities">{{ city.name }}</option>
              </select>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Activity'|translate}}</label>
              <select class="form-control" formControlName="activityId">
                <option [value]="null">{{'choose-activity'|translate}}</option>
                <option [value]="activity.id" *ngFor="let activity of activities">{{activity.name}}</option>
              </select>
            </div>


           <div class="col-md-6 form-group">
            <label>{{'AllowEditDate'|translate}}</label>
            <select class="form-control" formControlName="allowEditDate">
              <option value="true">{{ 'true'|translate }}</option>
              <option value="false">{{ 'false'|translate }}</option>
            </select>
          </div>
          <div class="col-md-6 form-group">
            <label>{{'AllowZatac'|translate}}</label>
            <select class="form-control" formControlName="allowZatac">
              <option value="true">{{ 'true'|translate }}</option>
              <option value="false">{{ 'false'|translate }}</option>
            </select>
          </div>
          <div class="col-md-6 form-group">
            <label>{{'AllowZatacForm'|translate}}</label>
            <select class="form-control" formControlName="allowZatacForm">
              <option value="true">{{ 'true'|translate }}</option>
              <option value="false">{{ 'false'|translate }}</option>
            </select>
          </div>
          </div>

          <br>
          <div class="input-group-prepend">
            <!-- [disabled]="!companyForm.valid" -->
            <button class="btn btn-outline-success ml-1" type="submit" >{{'Save'|translate}}</button>
            <button class="btn btn-default" routerLink="/dashboard/companies">{{'Back'|translate}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
