<div class="block-header">
  <div class="row">
    <div class="col-lg-6 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item active">{{ 'Sliders'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-12">
    <div class="card">
      <div class="header">
        <h2>{{'Sliders Table'|translate}}</h2>
        <br/>
        <a class="btn btn-info" routerLink="/dashboard/sliders/add-or-edit"><i class="fa fa-plus"></i> {{'Add New'|translate}}</a>
      </div>
      <div class="body">
        <div class="table-responsive" *ngIf="sliders?.length > 0">
          <table datatable  class="table table-hover dataTable table-custom">
            <thead class="thead-light">
            <tr>
              <th>#</th>
              <th>{{'Image'|translate}}</th>
              <th>{{'Title'|translate}}</th>
              <th>{{'Description'|translate}}</th>
              <th>{{'Operations'|translate}}</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let slider of sliders; let i = index">
              <td>{{ i + 1 }}</td>
              <td><img src="{{ baseUrl + slider.image }}" style="width: 60px; height: 60px;" /></td>
              <td>{{ slider.title }}</td>
              <td>{{ slider.description }}</td>
              <td>
                <a class="btn btn-sm btn-default" routerLink="/dashboard/sliders/add-or-edit/{{slider.id}}"><i class="icon-pencil"></i></a>
                <a class="btn btn-sm btn-default" (click)="removeSlider(slider.id)"><i class="icon-trash"></i></a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
        <h2 *ngIf="sliders?.length == 0">{{'There is no data'|translate}}</h2>
      </div>
    </div>
  </div>
</div>
