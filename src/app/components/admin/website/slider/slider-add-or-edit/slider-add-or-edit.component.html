<div class="block-header">
  <div class="row">
    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item"><a routerLink="/dashboard/sliders">{{'Sliders'|translate}}</a></li>
        <li class="breadcrumb-item active">{{ 'Add New'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-12 col-md-12">
    <div class="card">
      <div class="header">
        <h2> {{'Add New'|translate}}</h2>
      </div>
      <div class="body">
        <form [formGroup]="sliderForm" (submit)="onSubmit()" enctype="multipart/form-data">
          <div class="row">
            <div class="col-md-12 form-group">
              <label>{{'photo'|translate}}</label>
              <app-text-input [type]="'file'" (change)="onFileChange($event)" [label]="'photo'|translate" formControlName="image"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Title Arabic'|translate}}</label>
              <app-text-input [label]="'Title Arabic'|translate" formControlName="titleAr"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Title English'|translate}}</label>
              <app-text-input [label]="'Title English'|translate" formControlName="titleEn"></app-text-input>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'Description Arabic'|translate}}</label>
              <app-text-area [label]="'Description Arabic'|translate" formControlName="descriptionAr"></app-text-area>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Description English'|translate}}</label>
              <app-text-area [label]="'Description English'|translate" formControlName="descriptionEn"></app-text-area>
            </div>
          </div>
          <br>
          <div class="input-group-prepend">
            <button class="btn btn-outline-success ml-1" type="submit" [disabled]="!sliderForm.valid">{{'Save'|translate}}</button>
            <button class="btn btn-default" routerLink="/dashboard/sliders">{{'Back'|translate}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
