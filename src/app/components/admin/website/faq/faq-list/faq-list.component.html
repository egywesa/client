    </div>
  </div>

<kendo-grid
[kendoGridBinding]="gridView"
kendoGridSelectBy="id"
[(selectedKeys)]="mySelection"
[pageSize]="20"
[pageable]="true"
[sortable]="true"
[groupable]="true"
[reorderable]="true"
[resizable]="true"
[height]="500"
[columnMenu]="{ filter: true }"
>
<ng-template kendoGridToolbarTemplate>
    <input [style.width.px]="165" placeholder="Search in all columns..." kendoTextBox (input)="onFilter($event)"/>
    <kendo-grid-spacer></kendo-grid-spacer>
    <button kendoGridPDFCommand icon="file-pdf">Export to PDF</button>
</ng-template>
<kendo-grid-checkbox-column
    [width]="45"
    [headerClass]="{'text-center': true}"
    [class]="{'text-center': true}"
    [resizable]="false"
    [columnMenu]="false"
    [showSelectAll]="true"
></kendo-grid-checkbox-column>
<kendo-grid-column-group title="Employee" [columnMenu]="false">
   <kendo-grid-column field="id" title="id" [width]="220">
  </kendo-grid-column>
 
   <kendo-grid-column field="question" title="question" [width]="220">
    </kendo-grid-column>
    <kendo-grid-column
        field="answer"
        title="answer"
        [width]="100"
        [class]="{'text-center': true}"
        [resizable]="false"
    >
    </kendo-grid-column>
    <kendo-grid-column
        field="createdAt"
        title="createdAt"
        [width]="100"
        [class]="{'text-center': true}"
        [resizable]="false"
        filter="numeric"
    >
     
    </kendo-grid-column>
</kendo-grid-column-group>

<kendo-grid-pdf fileName="Employees.pdf" [repeatHeaders]="true"></kendo-grid-pdf>
<!-- <kendo-grid-excel fileName="Employees.xlsx"></kendo-grid-excel> -->
</kendo-grid>
