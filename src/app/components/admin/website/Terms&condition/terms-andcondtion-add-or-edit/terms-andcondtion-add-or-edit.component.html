<div class="block-header">
    <div class="row">
        <div class="col-lg-6 col-md-8 col-sm-12">
            <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i
                        class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
                <li class="breadcrumb-item active">{{ 'termsAndCondition '|translate }}</li>
            </ul>
        </div>
    </div>
</div>

<div class="row clearfix">
    <div class="col-lg-12">
        <div class="card">
            <div class="header">
                <h2>{{'termsAndCondition'|translate}}</h2>
            </div>
            <form [formGroup]="form">
                <div class="editor">
                    <div class="col-md-12 form-group">
                        <label>termsAndCondition</label>
                        <app-text-area formControlName="nameEn" rows="7" ></app-text-area>
                    </div>
                    <div class="col-md-12 form-group">
                        <label>الشروط الاحكام</label>
                        <app-text-area  formControlName="nameAr" rows="7" ></app-text-area>
                    </div>
                </div>
            </form>

            <br>
            <div class="input-group-prepend" style="margin: 1% 3%;">
              <button class="btn btn-outline-success ml-1" type="submit" (click)="save()">{{'Save'|translate}}</button>
              <button class="btn btn-default" routerLink="/dashboard/termsAndCondition">{{'Back'|translate}}</button>
            </div><br>
        </div>
    </div>
</div>
