<div class="block-header">
    <div class="row">
      <div class="col-lg-6 col-md-8 col-sm-12">
        <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
        <ul class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
          <li class="breadcrumb-item active">{{ 'termsAndCondition '|translate }}</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="row clearfix">
    <div class="col-lg-12" >
      <div class="card">
        <div class="header">
          <h2>{{' termsAndCondition '|translate}}</h2>
          <br/>
          <a class="btn btn-info" routerLink="/dashboard/termsAndCondition/add-or-edit"><i class="fa fa-plus"></i> {{'Add New'|translate}}</a>
        </div>
        <div class="body ">
          <div class="table-responsive" *ngIf="list?.length > 0">
            <div class="tablescroll">
              <table datatable  class="table table-hover dataTable table-custom " >
                <thead class="thead-light">
                <tr>
                  <th>#</th>
                  <th>content</th>
                  <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let term of list; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ term.name }}</td>
                  <td>
                    <a class="btn btn-sm btn-default" routerLink="/dashboard/termsAndCondition/add-or-edit/{{term.id}}"><i class="icon-pencil"></i></a>
                    <a class="btn btn-sm btn-default" (click)="removeterm(term.id)"><i class="icon-trash"></i></a>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
           
          </div>
          <h2 *ngIf="list?.length == 0">{{'There is no data'|translate}}</h2>
        </div>
      </div>
    </div>
  </div>
