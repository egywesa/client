<div class="block-header">

    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i
            class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item active">{{ 'Company Profile'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

      <div class="row">

          <div class="bg-light-info p-3">

              <h2 *ngIf="visible==1"> {{'Success, Redirect to Invoices'|translate}}</h2>
              <h2 *ngIf="visible==0"> {{'Error, Redirect to Payment'|translate}}</h2>

          </div>
        </div>
