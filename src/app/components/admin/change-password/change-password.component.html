<div class="block-header">
  <div class="row">
    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i
            class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item active">{{ 'Change Password'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-12 col-md-12">
    <div class="card">
      <div class="header">
        <h2> {{'Change Password'|translate}}</h2>
      </div>
      <div class="body">
        <form [formGroup]="changePasswordForm" (submit)="onSubmit()">
          <div class="row">
            <div class="col-md-12 form-group">
              <label>{{'Password'|translate}}</label>
              <app-text-input label="{{ 'Old Password' | translate }}" formControlName="oldPassword"
                type="password"></app-text-input>
            </div>
            <div class="col-md-12 form-group">
              <label>{{'NewPassword'|translate}}</label>
              <app-text-input label="{{ 'NewPassword' | translate }}" formControlName="password" type="password"></app-text-input>
            </div>
            <div class="col-md-12 form-group">
              <label>{{'Confirm Password'|translate}} {{'new'|translate}}</label>
              <app-text-input label="{{ 'Confirm Password' | translate }}" formControlName="confirmPassword"
                type="password"></app-text-input>
              <p *ngIf="passwordMatchError" class="text-danger">{{ 'Password does not match' | translate }}</p>
            </div>

          </div>
          <br>
          <div class="input-group-prepend">
            <button class="btn btn-outline-success ml-1" type="submit"
              [disabled]="!changePasswordForm.valid">{{'Save'|translate}}</button>
            <button class="btn btn-default" routerLink="/dashboard">{{'Back'|translate}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
