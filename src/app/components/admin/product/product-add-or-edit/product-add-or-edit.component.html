<div class="block-header">
  <div class="row">
    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item"><a routerLink="/dashboard/products">{{'Products'|translate}}</a></li>
        <li class="breadcrumb-item active">{{ 'Add New'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-12 col-md-12">
    <div class="card">
      <div class="header">
        <h2> {{'Add New'|translate}}</h2>
      </div>
      <div class="body">
        <form [formGroup]="productForm" (submit)="onSubmit()">
          <div class="row">
            <div class="col-md-12 form-group">
              <label>{{'Product Name'|translate}}</label><span style="color: red"> * </span>
              <app-text-input [label]="'Product Name'|translate" formControlName="productName"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Price'|translate}}</label><span style="color: red"> * </span>
              <app-text-input [label]="'Price'|translate" formControlName="price"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Product Id'|translate}} ( <span style="color: brown;">{{ 'not required'|translate }}</span> )</label>
              <app-text-input [label]="'Product Id'|translate" formControlName="productId"></app-text-input>
            </div>
          </div>
          <br>
          <div class="input-group-prepend">
            <button class="btn btn-outline-success ml-1" type="submit" [disabled]="!productForm.valid">{{'Save'|translate}}</button>
            <button class="btn btn-default" routerLink="/dashboard/products">{{'Back'|translate}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
