<div class="block-header">
  <div class="row">
    <div class="col-lg-12 col-md-8 col-sm-12">
      <h2><a href="javascript:void(0);" class="btn btn-xs btn-link btn-toggle-fullwidth"><i class="fa fa-arrow-right"></i></a>{{'home'|translate}}</h2>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="icon-home"></i></a></li>
        <li class="breadcrumb-item"><a routerLink="/dashboard/taxes">{{'Taxes'|translate}}</a></li>
        <li class="breadcrumb-item active">{{ 'Add New'|translate }}</li>
      </ul>
    </div>
  </div>
</div>

<div class="row clearfix">
  <div class="col-lg-12 col-md-12">
    <div class="card">
      <div class="header">
        <h2> {{'Add New'|translate}}</h2>
      </div>
      <div class="body">
        <form [formGroup]="taxForm" (submit)="onSubmit()">
          <div class="row">
            <div class="col-md-6 form-group">
              <label>{{'Name Arabic'|translate}}</label>
              <app-text-input [label]="'Name Arabic'|translate" formControlName="taxNameAr"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Name English'|translate}}</label>
              <app-text-input [label]="'Name English'|translate" formControlName="taxNameEn"></app-text-input>
            </div>
            <div class="col-md-12 form-group">
              <label>{{'Tax Value'|translate}}</label>
              <app-text-input [label]="'Tax Value'|translate" formControlName="taxValue"></app-text-input>
            </div>
          </div>
          <br>
          <div class="input-group-prepend">
            <button class="btn btn-outline-success ml-1" type="submit" [disabled]="!taxForm.valid">{{'Save'|translate}}</button>
            <button class="btn btn-default" routerLink="/dashboard/taxes">{{'Back'|translate}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
