<div class="card p-4">
  <form (ngSubmit)="addSupplier()" [formGroup]="supplierForm">
    <div class="row">
      <div class="col-lg-6">
        <div class="form-group">
          <label>{{ "suppliers.supplier-name" | translate }}</label>
          <input class="form-control" formControlName="name" />
          <div
            *ngIf="
              supplierForm.get('name').invalid &&
              supplierForm.get('name').touched
            "
          >
            <small
              class="text-danger"
              *ngIf="supplierForm.get('name')?.errors?.['required']"
            >
              {{ "form-validations.required" | translate }}
            </small>
            <small
              class="text-danger"
              *ngIf="
                supplierForm.get('name')?.errors?.['whitespace'] &&
                !supplierForm.get('name')?.errors?.['required']
              "
            >
              {{ "form-validations.empty" | translate }}
            </small>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="form-group">
          <label>{{ "suppliers.contact-name" | translate }}</label>
          <input class="form-control" formControlName="contactName" />
        </div>
      </div>
      <div class="col-lg-6">
        <div class="form-group">
          <label>{{ "form-labels.phone" | translate }}</label>
          <input class="form-control" formControlName="phone" />
        </div>
      </div>
      <div class="col-lg-6">
        <div class="form-group">
          <label>{{ "form-labels.email" | translate }}</label>
          <input class="form-control" formControlName="email" />
        </div>
      </div>
      <div class="col-12">
        <div class="form-group">
          <label>{{ "form-labels.address" | translate }}</label>
          <input class="form-control" formControlName="address" />
        </div>
      </div>

      <div class="col-12">
        <button
          class="btn btn-info"
          type="submit"
          [disabled]="supplierForm.invalid"
        >
          <i class="fa fa-plus mx-1"></i>
          {{ "suppliers.new-supplier" | translate }}
        </button>
      </div>
    </div>
  </form>
</div>
