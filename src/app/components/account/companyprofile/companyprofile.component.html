<div id="wrapper">
  <app-header-landing></app-header-landing>
  <div class="login">
     <div class="row form" >
      <div class="col-md-6 col-lg-6 col-xl-6 mx-auto ">
        <h1>سجل الان </h1>
        <form [formGroup]="profileForm" (submit)="onSubmit()" enctype="multipart/form-data">
          <div class="row">

            <div class="col-md-6 form-group">
              <label>{{'Company Name Arabic'|translate}}</label>
              <app-text-input [label]="'Company Name Arabic'|translate" formControlName="companyNameAr"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Company Name English'|translate}}</label>
              <app-text-input [label]="'Company Name English'|translate" formControlName="companyNameEn"></app-text-input>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'Address Arabic'|translate}}</label>
              <app-text-input [label]="'Address Arabic'|translate" formControlName="companyAddressAr"></app-text-input>
            </div>
            <div class="col-md-6 form-group">
              <label>{{'Address English'|translate}}</label>
              <app-text-input [label]="'Address English'|translate" formControlName="companyAddressEn"></app-text-input>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'city'|translate}}</label>
              <select class="form-control" formControlName="cityId">
                <option [value]="null">{{ 'choose city' | translate }}</option>
                <option [value]="city.id" *ngFor="let city of cities">{{ city.name }}</option>
              </select>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'Activity'|translate}}</label>
              <select class="form-control" formControlName="activityId">
                <option [value]="null">{{'choose-activity'|translate}}</option>
                <option [value]="activity.id" *ngFor="let activity of activities">{{activity.name}}</option>
              </select>
            </div>
         

            <div class="col-md-8 form-group">
              <label >{{'commercialRegNumber_12_chars'|translate}}</label>
              <app-text-input [label]="'commercialRegNumber'|translate" formControlName="commercialRegNumber"></app-text-input>
            </div>

         
            <div class="col-md-8 form-group">
              <label>{{'vat'|translate}}</label>
              <app-text-input [label]="'vat'|translate" formControlName="vat"></app-text-input>
            </div>

            <div class="col-md-6 form-group">
              <label>{{'invoiceLast'|translate}}</label>
              <app-text-input [label]="'invoiceLast'|translate" [disabled]="haveInvoices" formControlName="invoiceLast"></app-text-input>
            </div>
            <div class="col-md-10">
                <label>{{'logo'|translate}}
                  <span style="font-size: 11px;color: grey;">{{ 'signature_warning' | translate }} {{ 'current logo'|translate }}</span>

                </label>
                <app-text-input [type]="'file'" [label]="'logo'|translate" visbility="hidden"
                      (change)="onLogoChange($event)" formControlName="logo"></app-text-input>
            </div>
            <div class=" col-md-10">
              <label>{{'signature'|translate}}
                <span style="font-size: 11px;color: grey;">{{ 'signature_warning' | translate }}  {{ 'current signature'|translate }}</span>

              </label>
              <app-text-input [type]="'file'" [label]="'signature'|translate" visbility="hidden"
                      (change)="onSignatureChange($event)" formControlName="signature"></app-text-input>
            </div>
          </div><br> <br>
          <button type="submit" [disabled]="!canSubmit()" class=" btn loginbtn">{{ 'REGISTER' | translate }}</button>
          <div style="margin-top:8px; font-size:12px; color:#b00;" *ngIf="invalidRequiredFields().length>0">
            <strong>Missing / invalid:</strong>
            <span *ngFor="let f of invalidRequiredFields(); let i = index">{{f}}{{i < (invalidRequiredFields().length-1) ? ', ' : ''}}</span>
          </div>
       <br> <br>
        </form>
      </div>
      <div class="col-md-5 col-lg-5 col-xl-5 mx-auto ">
        <img src="assets/images/img/LOGIN3.png">

        <div class="steps">
          <span>
            <i class="fa fa-check-circle " aria-hidden="true"></i>
          </span>
          <span class="dots">
            ................................
          </span>
          <span>
            <i class="fa fa-check-circle step2" aria-hidden="true"></i>
          </span>
         </div>
      </div>

     </div>
  </div>

</div>
