<div id="wrapper">
  <app-header-landing></app-header-landing>
  <div class="login">
     <div class="row form" >
      <div class="col-md-5 col-lg-5 col-xl-5 mx-auto ">
        <h1> {{ 'registertitle' | translate }}</h1>
        <form class="form-auth-small" [formGroup]="registerForm" (submit)="onSubmit()">

          <div class="form-group">
            <label>{{ 'First Name' | translate }}</label>
            <app-text-input  formControlName="firstName"></app-text-input>
          </div>
          <div class="form-group">
            <label>{{ 'Last Name' | translate }}</label>
            <app-text-input  formControlName="lastName"></app-text-input>
          </div>
          <div class="form-group">
            <label>{{ 'Email Address' | translate }}</label>
            <app-text-input formControlName="email"></app-text-input>
          </div>
          <div class="form-group">
            <label>{{ 'Phone Number' | translate }}</label>
            <app-text-input  formControlName="PhoneNumber"></app-text-input>
          </div>
          <div class="form-group">
            <label>{{'tin_10_chars'|translate}}</label>
            <app-text-input  formControlName="tin"></app-text-input>
          </div>
         <div class="row">
          <div  class="col-md-6 form-group">
            <label>{{ 'Password' | translate }}</label>
            <app-text-input formControlName="password" type="password"></app-text-input>
          </div>
          <div class="col-md-6 form-group">
            <label>{{ 'Confirm Password' | translate }}</label>
            <app-text-input formControlName="confirmPassword" type="password"></app-text-input>
            <p *ngIf="passwordMatchError" class="text-danger">{{ 'Password does not match' | translate }}</p>
          </div>
           <div class="form-group" style="margin-right: 3%;">
              <input type="checkbox" id="terms" name="terms" [checked]="registerForm.get('terms')?.value" style="margin-left: 5px;" (click)="openTerms($event)">
              <label for="terms">  {{ 'acceptterms' | translate }}</label><br>
            </div>
         </div>

          <button type="submit" class=" btn loginbtn"[disabled]="registerForm.invalid">{{ 'REGISTER' | translate }}</button>
           <p>  {{ 'haveaccount' | translate }} <a routerLink="/account/login">  {{ 'LOGIN' | translate }}</a></p>
        </form>
      </div>
      <div class="col-md-5 col-lg-5 col-xl-5 mx-auto stepinmobile">
        <img src="assets/images/img/LOGIN3.png" class="inlab">
         <div class="steps">
          <span>
            <i class="fa fa-check-circle " aria-hidden="true"></i>
          </span>
          <span class="dots">
            ................................
          </span>
          <span>
            <i class="fa fa-check-circle step2" aria-hidden="true"></i>
          </span>
         </div>
      </div>

     </div>
  </div>

</div>
